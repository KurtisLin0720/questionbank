
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fc">
  <title>我的題庫｜線上題庫管理</title>
  <meta name="description" content="建立、整理、分享自己的線上題庫。">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f5f7fc;
      --card: #ffffff;
      --text: #20263a;
      --muted: #69738a;
      --primary: #4f65dc;
      --primary-hover: #3d50bf;
      --border: #e1e6f0;
      --danger: #c43e50;
      --success: #18794e;
      --radius: 16px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Noto Sans TC",
        "Microsoft JhengHei", sans-serif;
      line-height: 1.6;
    }

    button, input, textarea, select { font: inherit; }

    button {
      cursor: pointer;
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      background: var(--primary);
      color: white;
      font-weight: 650;
    }

    button:hover { background: var(--primary-hover); }
    button:disabled { opacity: .55; cursor: not-allowed; }

    button.secondary {
      color: var(--text);
      background: #edf0f8;
    }

    button.danger {
      color: var(--danger);
      background: #fff0f1;
    }

    button.small { padding: 6px 10px; font-size: 14px; }

    input, textarea, select {
      display: block;
      width: 100%;
      padding: 11px 12px;
      margin-top: 5px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: white;
      color: var(--text);
      min-width: 0;
    }

    textarea { resize: vertical; min-height: 85px; }
    input[type="checkbox"] { width: auto; display: inline-block; }
    input[type="file"] { padding: 9px; }

    label {
      display: block;
      font-weight: 650;
      margin-bottom: 13px;
    }

    .muted { color: var(--muted); font-size: 14px; }
    .hidden { display: none !important; }

    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 15px 20px;
      position: sticky;
      top: 0;
      z-index: 5;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand { font-size: 20px; font-weight: 850; }
    .brand span { color: var(--primary); }

    main {
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 16px 40px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 4px 18px #26365b08;
    }

    h1 { font-size: 27px; margin: 0 0 8px; }
    h2 { font-size: 21px; margin: 0 0 14px; }
    h3 { font-size: 17px; margin: 0 0 8px; }
    p { overflow-wrap: anywhere; }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .bank-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .bank-item {
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 15px;
      min-width: 0;
    }

    .bank-item.active {
      border-color: var(--primary);
      background: #f5f6ff;
    }

    .bank-item p { margin: 6px 0; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .actions button { margin-top: 4px; }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .status {
      border-radius: 10px;
      padding: 11px 14px;
      margin: 0 0 16px;
      background: #edf0f8;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .status.error { background: #fff0f1; color: #a5273b; }
    .status.success { background: #e9f8ef; color: var(--success); }

    .question-item {
      padding: 17px 0;
      border-top: 1px solid var(--border);
    }

    .question-item:first-child { border-top: 0; }
    .question-content { white-space: pre-wrap; overflow-wrap: anywhere; }
    .question-image {
      display: block;
      max-width: 100%;
      max-height: 360px;
      object-fit: contain;
      margin: 12px 0;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #fafbff;
    }

    .options-list { padding-left: 24px; }
    .options-list li { margin: 4px 0; overflow-wrap: anywhere; }
    .tag {
      display: inline-block;
      border-radius: 999px;
      background: #edf0f8;
      padding: 3px 9px;
      font-size: 12px;
      margin: 2px 5px 2px 0;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
    }

    footer {
      text-align: center;
      color: var(--muted);
      padding: 20px;
      font-size: 13px;
    }

    @media (max-width: 650px) {
      main { margin-top: 15px; padding: 0 11px 28px; }
      header { padding: 12px; }
      .card { padding: 15px; }
      .grid, .bank-list { grid-template-columns: 1fr; }
      h1 { font-size: 23px; }
    }
  </style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand"><span>我的題庫</span>｜Question Bank</div>
    <div id="userArea" class="actions">
      <span class="muted">尚未登入</span>
    </div>
  </div>
</header>

<main>
  <div id="status" class="status hidden" role="status" aria-live="polite"></div>

  <section id="authSection" class="card">
    <h1>歡迎使用我的題庫</h1>
    <p class="muted">登入後建立自己的題庫，也可以瀏覽公開題庫。</p>

    <form id="authForm">
      <label>
        電子郵件
        <input id="authEmail" type="email" autocomplete="email"
          placeholder="name@example.com" required>
      </label>
      <label>
        密碼
        <input id="authPassword" type="password"
          autocomplete="current-password" minlength="6"
          placeholder="至少 6 個字元" required>
      </label>
      <div class="actions">
        <button type="submit" id="loginButton">登入</button>
        <button type="button" class="secondary" id="signupButton">建立帳號</button>
      </div>
    </form>
    <p class="muted">
      如果註冊後尚未登入，請檢查電子郵件並依照確認信完成驗證。
    </p>
  </section>

  <section id="appSection" class="hidden">
    <section class="card">
      <div class="section-title">
        <div>
          <h2>我的題庫與公開題庫</h2>
          <p class="muted">選擇題庫後，就能查看裡面的題目。</p>
        </div>
        <button id="newBankButton">＋ 新增題庫</button>
      </div>

      <form id="bankForm" class="hidden">
        <h3 id="bankFormTitle">新增題庫</h3>
        <label>
          題庫名稱
          <input id="bankTitle" maxlength="150" required
            placeholder="例如：九年級自然科">
        </label>
        <div class="grid">
          <label>
            科目
            <input id="bankSubject" maxlength="100" placeholder="例如：自然">
          </label>
          <label class="check-row">
            <input id="bankPublic" type="checkbox">
            公開此題庫
          </label>
        </div>
        <label>
          題庫說明
          <textarea id="bankDescription" maxlength="3000"
            placeholder="簡單描述題庫內容（可留空）"></textarea>
        </label>
        <div class="actions">
          <button type="submit">儲存題庫</button>
          <button type="button" class="secondary" id="cancelBankButton">取消</button>
        </div>
      </form>

      <div id="bankList" class="bank-list"></div>
      <p id="bankEmpty" class="muted hidden">目前沒有可顯示的題庫。</p>
    </section>

    <section id="questionSection" class="card hidden">
      <div class="section-title">
        <div>
          <h2 id="selectedBankTitle">題目列表</h2>
          <p id="selectedBankDescription" class="muted"></p>
          <span id="selectedBankTags"></span>
        </div>
        <button id="newQuestionButton">＋ 新增題目</button>
      </div>

      <form id="questionForm" class="hidden">
        <h3 id="questionFormTitle">新增題目</h3>
        <label>
          題目內容
          <textarea id="questionContent" maxlength="10000"
            placeholder="輸入題目文字" required></textarea>
        </label>
        <label>
          題目圖片（選填）
          <input id="questionImage" type="file" accept="image/*">
          <span class="muted">支援一般圖片，單張上限 8 MB。選擇新圖片會取代舊圖片。</span>
        </label>
        <div id="currentImageInfo" class="muted hidden"></div>
        <label>
          選項（每行一個，選填）
          <textarea id="questionOptions" maxlength="10000"
            placeholder="A. 選項一&#10;B. 選項二&#10;C. 選項三&#10;D. 選項四"></textarea>
        </label>
        <label>
          正確答案（選填）
          <input id="questionAnswer" maxlength="1000"
            placeholder="例如：A 或 42">
        </label>
        <label>
          解題解析（選填）
          <textarea id="questionExplanation" maxlength="10000"
            placeholder="輸入解題過程或補充說明"></textarea>
        </label>
        <label>
          難度
          <select id="questionDifficulty">
            <option value="未設定">未設定</option>
            <option value="簡單">簡單</option>
            <option value="中等">中等</option>
            <option value="困難">困難</option>
          </select>
        </label>
        <div class="actions">
          <button type="submit" id="saveQuestionButton">儲存題目</button>
          <button type="button" class="secondary" id="cancelQuestionButton">取消</button>
        </div>
      </form>

      <div id="questionList"></div>
      <p id="questionEmpty" class="muted hidden">這個題庫目前還沒有題目。</p>
    </section>
  </section>
</main>

<footer>我的題庫 · 你的題目，由你整理</footer>

<script>
(() => {
  "use strict";

  // 公開設定：publishable key 可以放在前端。
  // 絕對不要把 service_role 或 secret 金鑰放在這裡。
  const SUPABASE_URL = "https://kfikegatnvzdumhcujis.supabase.co";
  const SUPABASE_KEY = "sb_publishable_fclRoTH0sX7WiWcrpjB30Q_fzFlgu_i";
  const BUCKET = "question-images";
  const MAX_IMAGE_SIZE = 8 * 1024 * 1024;

  const { createClient } = window.supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_KEY);

  let currentUser = null;
  let banks = [];
  let currentBank = null;
  let questions = [];
  let editingBankId = null;
  let editingQuestionId = null;
  let oldQuestionImage = null;
  let busy = false;

  const $ = id => document.getElementById(id);

  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[char]);
  }

  function showStatus(message, type = "") {
    const el = $("status");
    el.textContent = message;
    el.className = "status" + (type ? " " + type : "");
    el.classList.remove("hidden");
  }

  function clearStatus() {
    $("status").classList.add("hidden");
    $("status").textContent = "";
  }

  function errorMessage(error) {
    if (!error) return "發生未知錯誤。";
    const message = error.message || String(error);

    if (/row-level security|violates row-level security/i.test(message)) {
      return "操作被資料庫權限政策拒絕。請確認登入狀態及既有 RLS 政策。";
    }
    if (/invalid login credentials/i.test(message)) {
      return "登入失敗，請檢查電子郵件與密碼。";
    }
    if (/email not confirmed/i.test(message)) {
      return "你的電子郵件尚未驗證，請先查看信箱中的確認信。";
    }
    if (/duplicate key|already registered/i.test(message)) {
      return "這個電子郵件可能已經註冊，請嘗試登入。";
    }
    return message;
  }

  function setBusy(value) {
    busy = value;
    document.querySelectorAll("button").forEach(button => {
      button.disabled = value;
    });
  }

  function isOwner(bank) {
    return !!currentUser && !!bank && bank.user_id === currentUser.id;
  }

  function canEditQuestions() {
    return isOwner(currentBank);
  }

  function resetBankForm() {
    editingBankId = null;
    $("bankForm").reset();
    $("bankForm").classList.add("hidden");
    $("bankFormTitle").textContent = "新增題庫";
  }

  function resetQuestionForm() {
    editingQuestionId = null;
    oldQuestionImage = null;
    $("questionForm").reset();
    $("questionForm").classList.add("hidden");
    $("questionFormTitle").textContent = "新增題目";
    $("currentImageInfo").textContent = "";
    $("currentImageInfo").classList.add("hidden");
  }

  function renderUserArea() {
    if (!currentUser) {
      $("userArea").innerHTML = '<span class="muted">尚未登入</span>';
      return;
    }
    $("userArea").innerHTML =
      '<span class="muted">' + escapeHTML(currentUser.email || "已登入") +
      '</span><button class="secondary small" id="logoutButton">登出</button>';
  }

  async function refreshBanks() {
    const { data, error } = await db
      .from("question_banks")
      .select("*")
      .order("updated_at", { ascending: false });

    if (error) throw error;
    banks = data || [];
    renderBanks();
  }

  function renderBanks() {
    const list = $("bankList");
    $("bankEmpty").classList.toggle("hidden", banks.length > 0);

    list.innerHTML = banks.map(bank => {
      const owner = isOwner(bank);
      const active = currentBank && currentBank.id === bank.id;
      const description = bank.description || "尚未填寫說明";
      return `
        <article class="bank-item ${active ? "active" : ""}">
          <h3>${escapeHTML(bank.title)}</h3>
          <p class="muted">${escapeHTML(bank.subject || "未分類")}</p>
          <p>${escapeHTML(description)}</p>
          <p><span class="tag">${bank.is_public ? "公開題庫" : "私人題庫"}</span>
          ${owner ? '<span class="tag">我的題庫</span>' : ""}</p>
          <div class="actions">
            <button class="small" data-action="open-bank" data-id="${escapeHTML(bank.id)}">查看題目</button>
            ${owner ? `
              <button class="secondary small" data-action="edit-bank" data-id="${escapeHTML(bank.id)}">編輯</button>
              <button class="danger small" data-action="delete-bank" data-id="${escapeHTML(bank.id)}">刪除</button>
            ` : ""}
          </div>
        </article>`;
    }).join("");
  }

  async function openBank(bankId) {
    const bank = banks.find(item => item.id === bankId);
    if (!bank) return;

    currentBank = bank;
    resetQuestionForm();
    $("questionSection").classList.remove("hidden");
    $("selectedBankTitle").textContent = bank.title;
    $("selectedBankDescription").textContent = bank.description || "";
    $("selectedBankTags").innerHTML =
      '<span class="tag">' + escapeHTML(bank.subject || "未分類") + '</span>' +
      '<span class="tag">' + (bank.is_public ? "公開題庫" : "私人題庫") + '</span>';

    $("newQuestionButton").classList.toggle("hidden", !canEditQuestions());
    renderBanks();
    await refreshQuestions();
    $("questionSection").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  async function getImageURL(path) {
    if (!path) return null;

    // 相容舊資料中直接存放的公開圖片網址。
    if (/^https?:\/\//i.test(path)) return path;

    const { data, error } = await db.storage
      .from(BUCKET)
      .createSignedUrl(path, 3600);

    if (error) {
      console.warn("圖片網址產生失敗：", error.message);
      return null;
    }
    return data?.signedUrl || null;
  }

  async function refreshQuestions() {
    if (!currentBank) return;

    const { data, error } = await db
      .from("questions")
      .select("*")
      .eq("bank_id", currentBank.id)
      .order("created_at", { ascending: true });

    if (error) throw error;
    questions = data || [];
    await renderQuestions();
  }

  async function renderQuestions() {
    const list = $("questionList");
    $("questionEmpty").classList.toggle("hidden", questions.length > 0);

    const rendered = await Promise.all(questions.map(async question => {
      const imageURL = await getImageURL(question.image_url);
      const options = Array.isArray(question.options) ? question.options : [];
      const optionHTML = options.length
        ? '<ol class="options-list">' +
          options.map(option => '<li>' + escapeHTML(option) + '</li>').join("") +
          '</ol>'
        : "";

      const imageHTML = imageURL
        ? '<img class="question-image" src="' + escapeHTML(imageURL) +
          '" alt="題目圖片" loading="lazy">'
        : "";

      return `
        <article class="question-item">
          <div class="section-title">
            <span class="tag">${escapeHTML(question.difficulty || "未設定")}</span>
            ${canEditQuestions() ? `
              <div class="actions">
                <button class="secondary small" data-action="edit-question" data-id="${escapeHTML(question.id)}">編輯</button>
                <button class="danger small" data-action="delete-question" data-id="${escapeHTML(question.id)}">刪除</button>
              </div>
            ` : ""}
          </div>
          <div class="question-content">${escapeHTML(question.content)}</div>
          ${imageHTML}
          ${optionHTML}
          ${question.correct_answer ? `
            <p><strong>答案：</strong>${escapeHTML(question.correct_answer)}</p>
          ` : ""}
          ${question.explanation ? `
            <details>
              <summary>查看解析</summary>
              <p class="question-content">${escapeHTML(question.explanation)}</p>
            </details>
          ` : ""}
        </article>`;
    }));

    list.innerHTML = rendered.join("");
  }

  async function uploadImage(file) {
    if (!file) return null;
    if (!file.type || !file.type.startsWith("image/")) {
      throw new Error("請選擇圖片檔案。");
    }
    if (file.size > MAX_IMAGE_SIZE) {
      throw new Error("圖片超過 8 MB，請選擇較小的圖片。");
    }
    if (!currentUser) throw new Error("請先登入再上傳圖片。");

    const safeName = file.name
      .replace(/[^a-zA-Z0-9._-]/g, "_")
      .slice(-100) || "image";
    const path = currentUser.id + "/" + crypto.randomUUID() + "-" + safeName;

    const { error } = await db.storage.from(BUCKET).upload(path, file, {
      upsert: false,
      contentType: file.type,
      cacheControl: "3600"
    });

    if (error) throw error;
    return path;
  }

  async function removeStoredImage(path) {
    if (!path || /^https?:\/\//i.test(path)) return;

    const { error } = await db.storage.from(BUCKET).remove([path]);
    if (error) {
      console.warn("圖片未能刪除：", error.message);
    }
  }

  async function saveBank(event) {
    event.preventDefault();
    if (!currentUser) throw new Error("請先登入。");

    const payload = {
      title: $("bankTitle").value.trim(),
      subject: $("bankSubject").value.trim(),
      description: $("bankDescription").value.trim(),
      is_public: $("bankPublic").checked,
      updated_at: new Date().toISOString()
    };

    if (!payload.title) throw new Error("請輸入題庫名稱。");

    let result;
    if (editingBankId) {
      result = await db.from("question_banks")
        .update(payload)
        .eq("id", editingBankId)
        .select()
        .single();
    } else {
      result = await db.from("question_banks")
        .insert({ ...payload, user_id: currentUser.id })
        .select()
        .single();
    }

    if (result.error) throw result.error;
    const savedId = result.data.id;
    resetBankForm();
    await refreshBanks();
    const savedBank = banks.find(item => item.id === savedId);
    if (savedBank) await openBank(savedId);
    showStatus("題庫已儲存。", "success");
  }

  async function saveQuestion(event) {
    event.preventDefault();
    if (!currentUser) throw new Error("請先登入。");
    if (!currentBank || !canEditQuestions()) {
      throw new Error("你沒有編輯這個題庫的權限。");
    }

    const content = $("questionContent").value.trim();
    if (!content) throw new Error("請輸入題目內容。");

    const file = $("questionImage").files[0];
    let imagePath = oldQuestionImage;
    let newlyUploadedPath = null;

    try {
      if (file) {
        newlyUploadedPath = await uploadImage(file);
        imagePath = newlyUploadedPath;
      }

      const options = $("questionOptions").value
        .split(/\r?\n/)
        .map(line => line.trim())
        .filter(Boolean);

      const payload = {
        bank_id: currentBank.id,
        content,
        image_url: imagePath,
        options,
        correct_answer: $("questionAnswer").value.trim(),
        explanation: $("questionExplanation").value.trim(),
        difficulty: $("questionDifficulty").value,
        updated_at: new Date().toISOString()
      };

      let result;
      if (editingQuestionId) {
        result = await db.from("questions")
          .update(payload)
          .eq("id", editingQuestionId)
          .eq("bank_id", currentBank.id)
          .select()
          .single();
      } else {
        result = await db.from("questions")
          .insert(payload)
          .select()
          .single();
      }

      if (result.error) throw result.error;

      if (file && oldQuestionImage && oldQuestionImage !== imagePath) {
        await removeStoredImage(oldQuestionImage);
      }

      resetQuestionForm();
      await refreshQuestions();
      showStatus("題目已儲存。", "success");
    } catch (error) {
      // 如果上傳成功但題目儲存失敗，清除剛上傳的檔案。
      if (newlyUploadedPath) await removeStoredImage(newlyUploadedPath);
      throw error;
    }
  }

  async function deleteQuestion(questionId) {
    const question = questions.find(item => item.id === questionId);
    if (!question || !canEditQuestions()) return;
    if (!confirm("確定要刪除這道題目嗎？")) return;

    const { error } = await db.from("questions")
      .delete()
      .eq("id", questionId)
      .eq("bank_id", currentBank.id);

    if (error) throw error;
    await removeStoredImage(question.image_url);
    await refreshQuestions();
    showStatus("題目已刪除。", "success");
  }

  async function deleteBank(bankId) {
    const bank = banks.find(item => item.id === bankId);
    if (!bank || !isOwner(bank)) return;

    if (!confirm("確定刪除題庫「" + bank.title +
      "」及其中的所有題目嗎？此操作無法復原。")) return;

    const { data: bankQuestions, error: readError } = await db
      .from("questions")
      .select("id,image_url")
      .eq("bank_id", bankId);

    if (readError) throw readError;

    const { error: questionDeleteError } = await db
      .from("questions")
      .delete()
      .eq("bank_id", bankId);

    if (questionDeleteError) throw questionDeleteError;

    for (const question of (bankQuestions || [])) {
      await removeStoredImage(question.image_url);
    }

    const { error } = await db.from("question_banks")
      .delete()
      .eq("id", bankId);

    if (error) throw error;

    if (currentBank?.id === bankId) {
      currentBank = null;
      questions = [];
      $("questionSection").classList.add("hidden");
    }

    await refreshBanks();
    showStatus("題庫已刪除。", "success");
  }

  async function handleClick(event) {
    const button = event.target.closest("[data-action]");
    if (!button) return;

    const action = button.dataset.action;
    const id = button.dataset.id;

    if (action === "open-bank") {
      await openBank(id);
      return;
    }

    if (action === "edit-bank") {
      const bank = banks.find(item => item.id === id);
      if (!bank || !isOwner(bank)) return;
      editingBankId = id;
      $("bankTitle").value = bank.title || "";
      $("bankSubject").value = bank.subject || "";
      $("bankDescription").value = bank.description || "";
      $("bankPublic").checked = !!bank.is_public;
      $("bankFormTitle").textContent = "編輯題庫";
      $("bankForm").classList.remove("hidden");
      $("bankForm").scrollIntoView({ behavior: "smooth", block: "start" });
      return;
    }

    if (action === "delete-bank") {
      await deleteBank(id);
      return;
    }

    if (action === "edit-question") {
      const question = questions.find(item => item.id === id);
      if (!question || !canEditQuestions()) return;

      editingQuestionId = id;
      oldQuestionImage = question.image_url || null;
      $("questionContent").value = question.content || "";
      $("questionOptions").value = Array.isArray(question.options)
        ? question.options.join("\n") : "";
      $("questionAnswer").value = question.correct_answer || "";
      $("questionExplanation").value = question.explanation || "";
      $("questionDifficulty").value = question.difficulty || "未設定";
      $("questionImage").value = "";
      $("questionFormTitle").textContent = "編輯題目";
      $("currentImageInfo").textContent = oldQuestionImage
        ? "目前已有圖片。如需替換，請選擇新圖片；不選則保留原圖。"
        : "目前沒有圖片。";
      $("currentImageInfo").classList.remove("hidden");
      $("questionForm").classList.remove("hidden");
      $("questionForm").scrollIntoView({ behavior: "smooth", block: "start" });
      return;
    }

    if (action === "delete-question") {
      await deleteQuestion(id);
    }
  }

  async function signIn() {
    const email = $("authEmail").value.trim();
    const password = $("authPassword").value;
    const { error } = await db.auth.signInWithPassword({ email, password });
    if (error) throw error;
    showStatus("登入成功。", "success");
  }

  async function signUp() {
    const email = $("authEmail").value.trim();
    const password = $("authPassword").value;
    const { data, error } = await db.auth.signUp({ email, password });
    if (error) throw error;

    if (data.session) {
      showStatus("註冊成功，已登入。", "success");
    } else {
      showStatus("註冊申請已送出。請查看電子郵件並完成驗證，再回來登入。", "success");
    }
  }

  async function signOut() {
    const { error } = await db.auth.signOut();
    if (error) throw error;
    currentBank = null;
    banks = [];
    questions = [];
    resetBankForm();
    resetQuestionForm();
    $("questionSection").classList.add("hidden");
    showStatus("已登出。", "success");
  }

  async function syncSession() {
    const { data, error } = await db.auth.getSession();
    if (error) throw error;
    await applyUser(data.session?.user || null);
  }

  async function applyUser(user) {
    currentUser = user;
    renderUserArea();

    $("authSection").classList.toggle("hidden", !!user);
    $("appSection").classList.toggle("hidden", !user);

    if (!user) {
      banks = [];
      questions = [];
      currentBank = null;
      resetBankForm();
      resetQuestionForm();
      $("bankList").innerHTML = "";
      $("questionList").innerHTML = "";
      $("questionSection").classList.add("hidden");
      return;
    }

    await refreshBanks();

    if (currentBank) {
      const refreshed = banks.find(item => item.id === currentBank.id);
      if (refreshed) {
        currentBank = refreshed;
        await openBank(refreshed.id);
      } else {
        currentBank = null;
        $("questionSection").classList.add("hidden");
      }
    }
  }

  $("authForm").addEventListener("submit", event => {
    event.preventDefault();
    runAction(signIn);
  });

  $("signupButton").addEventListener("click", () => runAction(signUp));
  $("newBankButton").addEventListener("click", () => {
    editingBankId = null;
    $("bankForm").reset();
    $("bankFormTitle").textContent = "新增題庫";
    $("bankForm").classList.remove("hidden");
    $("bankForm").scrollIntoView({ behavior: "smooth", block: "start" });
  });
  $("cancelBankButton").addEventListener("click", resetBankForm);
  $("bankForm").addEventListener("submit", event => runAction(() => saveBank(event)));

  $("newQuestionButton").addEventListener("click", () => {
    if (!canEditQuestions()) return;
    resetQuestionForm();
    $("questionForm").classList.remove("hidden");
    $("questionForm").scrollIntoView({ behavior: "smooth", block: "start" });
  });
  $("cancelQuestionButton").addEventListener("click", resetQuestionForm);
  $("questionForm").addEventListener("submit", event => runAction(() => saveQuestion(event)));

  $("userArea").addEventListener("click", event => {
    if (event.target.id === "logoutButton") runAction(signOut);
  });

  document.addEventListener("click", event => {
    const button = event.target.closest("[data-action]");
    if (!button || busy) return;
    runAction(() => handleClick(event));
  });

  async function runAction(action) {
    if (busy) return;
    clearStatus();
    setBusy(true);
    try {
      await action();
    } catch (error) {
      console.error(error);
      showStatus(errorMessage(error), "error");
    } finally {
      setBusy(false);
    }
  }

  db.auth.onAuthStateChange((event, session) => {
    // 避免在 Supabase Auth 回呼內直接執行大量資料庫請求。
    if (event === "SIGNED_IN" || event === "SIGNED_OUT" ||
        event === "USER_UPDATED" || event === "INITIAL_SESSION") {
      setTimeout(() => {
        applyUser(session?.user || null).catch(error => {
          console.error(error);
          showStatus(errorMessage(error), "error");
        });
      }, 0);
    }
  });

  syncSession().catch(error => {
    console.error(error);
    showStatus(
      "無法初始化網站。請確認網路連線、Supabase Project URL 和公開金鑰。詳情：" +
      errorMessage(error),
      "error"
    );
  });
})();
</script>
</body>
</html>
